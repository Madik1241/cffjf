<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Qalan KZ — Автоматты тексеру</title>
    <style>
        :root { 
            --qalan-blue: #0047FF; 
            --bg: #F8F9FD; 
            --card: #ffffff; 
            --text: #1A1A1B; 
            --success: #00B894; 
            --error: #D63031; 
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            padding: 40px 20px;
            margin: 0;
        }

        .app-card { 
            width: 100%; 
            max-width: 850px; 
            background: var(--card); 
            border-radius: 24px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); 
            overflow: hidden; 
            border: 1px solid #E5E9F0; 
        }

        .header { 
            background: var(--qalan-blue); 
            color: white; 
            padding: 30px; 
            text-align: center; 
        }
        
        .header h1 { margin: 0; font-size: 28px; letter-spacing: -1px; }

        .content { padding: 35px; }
        
        .task-select { 
            width: 100%; padding: 14px; 
            background: #F1F2F6; border: 1px solid #E5E9F0; 
            border-radius: 12px; margin-bottom: 20px; font-size: 16px; outline: none;
        }
        
        .task-info { 
            background: #E8EFFF; padding: 20px; 
            border-left: 5px solid var(--qalan-blue); 
            margin-bottom: 25px; border-radius: 8px; color: #2D3436;
        }
        
        textarea { 
            width: 100%; height: 220px; 
            background: #1e1e1e; color: #9cdcfe; 
            border-radius: 16px; padding: 20px; 
            font-family: 'Fira Code', monospace; font-size: 14px; 
            box-sizing: border-box; border: none; outline: none;
            margin-bottom: 20px;
        }
        
        .btn-check { 
            width: 100%; padding: 18px; 
            background: var(--qalan-blue); color: white; 
            border: none; border-radius: 50px; 
            font-size: 18px; font-weight: 700; 
            cursor: pointer; transition: 0.3s; 
        }

        .btn-check:disabled { background: #b2bec3; cursor: not-allowed; }
        
        /* Progress Bar */
        .progress-container {
            height: 8px; background: #eee; border-radius: 10px;
            margin: 20px 0; display: none; overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 0; background: var(--qalan-blue);
            transition: width 0.4s;
        }

        #result-panel { margin-top: 30px; }
        
        .test-row { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 15px 20px; background: #F8F9FD; 
            margin-bottom: 10px; border-radius: 12px;
            border: 1px solid #E5E9F0;
            animation: slideIn 0.3s ease-out forwards;
        }
        
        .pass { border-left: 5px solid var(--success); }
        .fail { border-left: 5px solid var(--error); }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid var(--qalan-blue);
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite; display: inline-block;
            vertical-align: middle; margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>QALAN <span style="font-weight: 300;">KZ</span></h1>
    </div>
    
    <div class="content">
        <label style="font-weight: 600; display: block; margin-bottom: 10px;">Тапсырманы таңдаңыз:</label>
        <select id="taskPicker" class="task-select" onchange="updateTaskInfo()">
            <option value="sum">1. Екі санның қосындысы</option>
            <option value="max">2. Ең үлкен санды табу</option>
            <option value="even">3. Жұп санды тексеру</option>
        </select>

        <div id="taskDesc" class="task-info"></div>

        <div class="code-area">
            <textarea id="editor" spellcheck="false">function solution(a, b) {
    // Жауабыңды осында жаз
    return a + b;
}</textarea>
        </div>

        <button id="mainBtn" class="btn-check" onclick="startTest()">Тексеруді бастау</button>

        <div class="progress-container" id="progCont">
            <div class="progress-bar" id="progBar"></div>
        </div>

        <div id="result-panel">
            <div id="testLogs"></div>
        </div>
    </div>
</div>

<script>
    const database = {
        sum: {
            desc: "<b>Тапсырма:</b> <code>solution(a, b)</code> функциясы екі санның қосындысын қайтаруы керек.",
            tests: [{ in: [5, 5], out: 10 }, { in: [12, 8], out: 20 }, { in: [-1, 1], out: 0 }]
        },
        max: {
            desc: "<b>Тапсырма:</b> <code>solution(a, b)</code> екі санның ішіндегі ең үлкенін қайтаруы керек.",
            tests: [{ in: [10, 20], out: 20 }, { in: [55, 2], out: 55 }, { in: [-1, -5], out: -1 }]
        },
        even: {
            desc: "<b>Тапсырма:</b> Егер сан жұп болса <code>true</code>, тақ болса <code>false</code> қайтарыңыз.",
            tests: [{ in: [4], out: true }, { in: [7], out: false }, { in: [0], out: true }]
        }
    };

    function updateTaskInfo() {
        const id = document.getElementById('taskPicker').value;
        document.getElementById('taskDesc').innerHTML = database[id].desc;
        document.getElementById('testLogs').innerHTML = "";
        document.getElementById('progCont').style.display = 'none';
    }

    async function startTest() {
        const btn = document.getElementById('mainBtn');
        const logs = document.getElementById('testLogs');
        const bar = document.getElementById('progBar');
        const cont = document.getElementById('progCont');
        const code = document.getElementById('editor').value;
        const currentTask = database[document.getElementById('taskPicker').value];

        // UI Reset
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Тексерілуде...';
        logs.innerHTML = "";
        cont.style.display = 'block';
        bar.style.width = '0%';

        // Имитация задержки сервера
        await new Promise(r => setTimeout(r, 1200));

        try {
            const userFunc = new Function('...args', code + "\n return solution(...args);");
            let passed = 0;

            for (let i = 0; i < currentTask.tests.length; i++) {
                await new Promise(r => setTimeout(r, 400)); // Анимация поочередного появления
                const test = currentTask.tests[i];
                const result = userFunc(...test.in);
                const isCorrect = JSON.stringify(result) === JSON.stringify(test.out);
                
                if (isCorrect) passed++;
                
                const row = document.createElement('div');
                row.className = `test-row ${isCorrect ? 'pass' : 'fail'}`;
                row.innerHTML = `
                    <span>Тест ${i + 1} (Енгізілді: ${test.in})</span>
                    <span style="font-weight:bold; color:${isCorrect ? '#00B894':'#D63031'}">
                        ${isCorrect ? '✓ Сәтті' : '✗ Қате'}
                    </span>
                `;
                logs.appendChild(row);
                bar.style.width = ((i + 1) / currentTask.tests.length * 100) + '%';
            }

            btn.disabled = false;
            btn.innerHTML = 'Тексеруді бастау';
            
            if (passed === currentTask.tests.length) {
                setTimeout(() => alert("Жарайсың! Барлық тесттен өттің! 🏆"), 200);
            }

        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = 'Тексеруді бастау';
            logs.innerHTML = `<div style="color:red; padding:20px; background:#fff5f5; border-radius:12px;"><b>Кодта қате бар:</b> ${err.message}</div>`;
        }
    }

    updateTaskInfo();
</script>
</body>
</html>
